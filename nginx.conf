server {
    listen 80;

    # No trailing path on proxy_pass, so the full /api/... URI is forwarded
    # unchanged — matching how the routes are mounted in server/index.js.
    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
