# electron-builder packaging config. Split from package.json since the file
# list here is long enough to hurt package.json's readability.
appId: com.skilltape.app
productName: SkillTape

# electron-builder's own automatic native-module rebuild is disabled on
# purpose. It runs node-gyp for the HOST platform regardless of which
# target you're packaging for — cross-compiling a real Windows/macOS
# binary from this Linux shell isn't possible anyway. Running it while
# packaging for Windows produced a Linux ELF `bcrypt_lib.node` under
# node_modules/bcrypt/build/Release/, which node-gyp-build's loader
# prioritizes over the correct bundled node_modules/bcrypt/prebuilds/
# win32-x64/bcrypt.node — the app shipped, but crashed on launch with
# "not a valid Win32 application" the moment it required bcrypt. Native
# module prep is handled explicitly instead, per target — see README.
npmRebuild: false

# Only what the packaged app actually needs at runtime:
#   dist/       — built frontend, served by server/index.js's static fallback
#   server/     — the Express API, spawned as a child process by electron/main.cjs
#   src/data/   — server/seed.js imports curriculum.js, which imports every
#                 topic file; needed at runtime for seeding, not just the build
# node_modules is included by electron-builder automatically (production
# deps only) — no need to list it here.
files:
  - dist/**/*
  - server/**/*
  - src/data/**/*
  - electron/**/*
  # electron/main.cjs loads build/icons/256x256.png at runtime for the window's
  # own icon, and buildResources (build/) is not packaged by default — so the
  # generated set has to be listed here to make it inside the app bundle. The
  # 1254x1254 master is deliberately NOT included: nothing reads it at runtime,
  # and it is 850 kB.
  - build/icons/**/*
  - package.json
  - "!**/*.map"

directories:
  output: dist-electron

# Where built installers get uploaded, and — more importantly — the URL that
# gets baked into the app so electron-updater knows which release feed to poll
# at runtime. Both halves come from this one block: drop it and `--publish`
# has no destination AND the installed app has no idea where to check.
publish:
  provider: github
  owner: EthanC306
  repo: SkillTape
  releaseType: draft

# Icons come from build/icons/, generated from the build/icon.png master by
# `npm run icons` (scripts/makeIcons.js). To change the logo: drop a new square
# PNG at build/icon.png, run that script, rebuild.
#
# linux.icon MUST point at the directory, not a single file. Given one file,
# electron-builder does not resize — it installs it under a hicolor directory
# named after its literal dimensions, so a 1254x1254 master ends up in
# hicolor/1254x1254/, which is not a freedesktop standard size and is therefore
# ignored by every desktop environment. The app then installs with no icon at
# all. Pointing at a directory of NxN.png files is what avoids that.
linux:
  target:
    - AppImage
    - deb
  icon: build/icons
  category: Education
  # Required for the .deb target specifically (Debian's maintainer field) —
  # package.json has no "author", so electron-builder has nothing to fall
  # back to. Set here rather than adding an author to package.json, since
  # that's a repo-wide change this doesn't need to make.
  maintainer: SkillTape <skilltape@localhost>

win:
  target:
    - nsis

  icon: build/icon.ico
  # better-sqlite3 and bcrypt both ship a win32-x64 N-API prebuild bundled
  # directly in their npm packages (no compile, no network fetch needed) —
  # confirmed present under node_modules/{better-sqlite3,bcrypt}/prebuilds/
  # win32-x64/. That derisks the native-module side of a cross-build from
  # Linux. What's NOT yet verified from this shell: whether electron-builder
  # can actually produce the NSIS installer itself without Wine, which isn't
  # installed here — see the README note on this.

nsis:
  # Default is `${productName} Setup ${version}.${ext}` — "SkillTape Setup
  # 1.0.1.exe", with spaces. Spaces are the one thing both halves of the
  # update path handle *differently*: electron-updater's resolveFiles
  # (GitHubProvider.js) rewrites spaces to `-` when it builds the download
  # URL, GitHub's upload API turns them into `.` on its own, and
  # electron-publish uploads with the raw spaced name. Any one of those alone
  # is fine; together they can disagree about what the asset is called and
  # the download 404s. A name with no spaces in it removes the whole class of
  # mismatch rather than trying to reason about which layer normalizes what.
  artifactName: ${productName}-Setup-${version}.${ext}
